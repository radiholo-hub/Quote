name: GSAT English tests
on:
  # 送往上線分支的 PR 一律執行（不設檔案條件），才能當作合併必要檢查，不會因為沒觸發而一直等待
  pull_request:
    branches: [claude/daily-quotes-website-lbh2wi]
  push:
    branches: [claude/daily-quotes-website-lbh2wi]
    paths:
      - 'gsat/**'
      - 'tools/stage_site.sh'
      - 'tools/parse_gsat.py'
      - 'tools/build_nonmc.py'
      - 'tools/gsat_inventory.py'
      - 'tools/gsat_review_sheet.py'
      - 'tools/gsat_vocab_review_sheet.py'
      - 'tools/build_vocab_index.py'
      - 'tools/verify_vocab_index.py'
      - 'tools/verify_gsat_audio.py'
      - 'tools/gsat_exam_freeze.py'
      - 'tools/gsat_signoff.py'
      - 'tools/gsat_audio_provenance.py'
      - 'tools/make_gsat_audio.py'
      - '.github/workflows/gsat-audio-preview.yml'
      - 'tools/gsat_backup.py'
      - 'tools/gsat_audio_test_page.py'
      - 'tools/build_gsat_audio_manifest.py'
      - 'tools/make_score_rescue_audio.py'
      - 'docs/gsat/**'
      - '.github/workflows/gsat-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: gsat-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 和 score-rescue-tests 同一個 Playwright 官方映像；版本要和 gsat/tests/requirements.txt 的 playwright 相同。
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gsat
            docs/gsat
            tools/stage_site.sh
            tools/gsat_inventory.py
            tools/gsat_review_sheet.py
            tools/build_vocab_index.py
            tools/gsat_vocab_review_sheet.py
            tools/verify_gsat_audio.py
            tools/gsat_exam_freeze.py
            tools/gsat_signoff.py
            tools/gsat_audio_provenance.py
            tools/make_gsat_audio.py
            .github/workflows/gsat-audio-preview.yml
            tools/gsat_audio_test_page.py
            tools/build_gsat_audio_manifest.py
            tools/make_score_rescue_audio.py
          sparse-checkout-cone-mode: false
      - name: Install node and ffmpeg (so the node / ffprobe checks run instead of being skipped)
        timeout-minutes: 5
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nodejs ffmpeg
          node --version && ffprobe -version | head -1
      - name: Install test tools
        timeout-minutes: 5
        run: python3 -m pip install --break-system-packages -r gsat/tests/requirements.txt
      - name: Run tests
        # 映像內建 Chromium、Firefox、WebKit。要求 WebKit 一定要存在：iPhone Safari 的測試在 CI 不能被悄悄略過。
        env:
          GSAT_REQUIRE_WEBKIT: '1'
        # 在 CI 這些檢查不能被略過:node(審核表、索引、試聽頁)與 ffprobe/ffmpeg(音檔核對)都已安裝
        run: python3 -m pytest gsat/tests -q -rs -p no:cacheprovider --junitxml=/tmp/gsat-junit.xml
      - name: Fail if any test was skipped for a missing tool
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          bad = []
          for tc in ET.parse('/tmp/gsat-junit.xml').iter('testcase'):
              for sk in tc.findall('skipped'):
                  msg = sk.get('message', '')
                  if any(k in msg for k in ('node', 'ffprobe', 'ffmpeg')):
                      bad.append(tc.get('classname') + '::' + tc.get('name') + ' — ' + msg)
          print('\n'.join(bad) or 'no tool-related skips')
          raise SystemExit(1 if bad else 0)
          PY
