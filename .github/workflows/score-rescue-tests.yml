name: Score Rescue tests
on:
  # 送往上線分支的 PR 一律執行（不設檔案條件），才能當作合併必要檢查，不會因為沒觸發而一直等待
  pull_request:
    branches: [claude/daily-quotes-website-lbh2wi]
  push:
    branches: [claude/daily-quotes-website-lbh2wi]
    paths:
      - 'score-rescue/index.html'
      - 'score-rescue/tests/**'
      - 'tools/make_score_rescue_audio.py'
      - 'tools/audio_changes.sh'
      - '.github/workflows/score-rescue-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # 分支保護的「必要檢查」以這個名稱選取
    name: score-rescue-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 用 Playwright 官方映像（已含瀏覽器、相依套件與字型），不再從 Ubuntu 套件來源安裝：
    # 那裡曾兩次在下載字型時卡住，讓測試逾時。映像版本要和 requirements.txt 的 playwright 相同。
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          # 測試不需要音檔，只取網頁、測試、產生音檔的程式與搬運新音檔的腳本
          sparse-checkout: |
            score-rescue/index.html
            score-rescue/tests
            tools/make_score_rescue_audio.py
            tools/audio_changes.sh
          sparse-checkout-cone-mode: false
      - name: Install test tools
        timeout-minutes: 5
        run: |
          python3 -m pip install --break-system-packages -r score-rescue/tests/requirements.txt
          python3 -c "import importlib.metadata as m; print('playwright', m.version('playwright'), 'pytest', m.version('pytest'))"
      - name: Run tests
        run: python3 -m pytest score-rescue/tests -q
