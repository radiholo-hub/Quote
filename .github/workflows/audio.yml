name: Generate audio
on:
  workflow_dispatch:
  push:
    paths: ["quotes.js", "tools/make_audio.py"]
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts && python tools/make_audio.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Generate Taiwan Mandarin audio" && git push)
