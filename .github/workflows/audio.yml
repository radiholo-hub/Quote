name: Generate audio
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: '只重產一段既有的 Score Rescue 音檔，用來測試「音檔 PR → 自動測試 → 合併」流程'
        type: boolean
        default: false
  push:
    branches: [claude/daily-quotes-website-lbh2wi]
    paths: ["quotes.js", "tools/make_audio.py", "score-rescue/index.html", "tools/make_score_rescue_audio.py"]
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
concurrency:
  group: generate-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: claude/daily-quotes-website-lbh2wi
    steps:
      # 手動執行也只能從上線分支啟動
      - name: 確認從上線分支執行
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$BASE" ]; then
            echo "::error::Generate audio 只能從 $BASE 執行（目前是 $GITHUB_REF）"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Smoke test：刪除一段既有音檔，讓它重新產生
        if: inputs.smoke_test
        run: |
          python - <<'EOF'
          import os
          tool = 'tools/make_score_rescue_audio.py'
          src = open(tool, encoding='utf-8').read()
          g = {'__name__': 'smoke', '__file__': os.path.abspath(tool)}
          exec(src[:src.index('async def main')], g)
          text = sorted(g['collect']())[0]
          path = 'score-rescue/audio/' + g['sr_hash'](text) + '.mp3'
          print('smoke test: regenerate', path)
          os.remove(path)
          EOF
      # 以下任何一步失敗都會停止：產生失敗或音檔不齊全時，不開 PR、不合併
      - run: pip install edge-tts && python tools/make_audio.py
      - env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/make_score_rescue_audio.py
      - name: 確認音檔齊全
        run: python tools/check_audio_complete.py
      # 上線分支設有必要檢查，音檔不直接推上去，改開 PR、在 PR 分支跑測試，通過才合併（細節見腳本開頭）
      - name: 開音檔 PR，測試通過後合併
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          bash tools/publish_audio_pr.sh
