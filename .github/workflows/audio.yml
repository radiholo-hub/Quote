name: Generate audio
on:
  workflow_dispatch:
  push:
    paths: ["quotes.js", "tools/make_audio.py", "score-rescue/index.html", "tools/make_score_rescue_audio.py"]
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts && python tools/make_audio.py
      - if: always()
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/make_score_rescue_audio.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add audio score-rescue/audio
          git diff --cached --quiet || (git commit -m "Generate audio" && git push)
