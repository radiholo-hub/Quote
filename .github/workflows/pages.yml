name: Deploy site
on:
  push:
    branches: [claude/daily-quotes-website-lbh2wi]
  workflow_run:
    workflows: ["Generate audio"]
    types: [completed]
    branches: [claude/daily-quotes-website-lbh2wi]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 和 Cloudflare Pages 共用同一支整理腳本，兩邊部署的內容相同
      - name: Stage site files
        run: bash tools/stage_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
