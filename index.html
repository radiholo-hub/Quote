<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日佳句</title>
<meta name="description" content="每天一句中英文名人佳句，相信語言的力量，日日精進。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>每日佳句</h1>
    <p class="tag">語言有力量。每天讀一句，人生慢慢進步。</p>
  </header>

  <div class="langs" role="group" aria-label="語言">
    <button data-lang="both" aria-pressed="true">中英對照</button>
    <button data-lang="zh" aria-pressed="false">只看中文</button>
    <button data-lang="en" aria-pressed="false">英文</button>
  </div>

  <article class="card" id="card" aria-live="polite">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="date" id="date"></div>
    <blockquote>
      <p class="zh" id="zh"></p>
      <p class="en" id="en"></p>
    </blockquote>
    <div class="by" id="by"></div>
    <div class="credit" id="credit"></div>
  </article>

  <nav class="actions">
    <button id="prev" aria-label="昨天">← 昨天</button>
    <button id="today">今天</button>
    <button id="next" aria-label="明天">明天 →</button>
  </nav>
  <nav class="actions">
    <button id="speak">🔊 朗讀</button>
    <label class="auto"><input type="checkbox" id="auto"> 自動朗讀</label>
    <button id="copy">複製</button>
    <button id="share">分享</button>
  </nav>

  <p class="voice"><label>語音 <select id="voice" hidden></select></label><br><span id="vstatus"></span></p>

  <p class="meta" id="meta"></p>
</main>
<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
