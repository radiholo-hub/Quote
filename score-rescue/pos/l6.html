<style>
:root{
  --paper:#F7F3E8;--sheet:#fff;--ink:#262626;--muted:#5B5B5B;--line:#E4DCC6;--wine:#6B2D3C;
  --ok:#1F653C;--ok-soft:#EDF6EF;--ok-line:#A9D3B8;--bad:#A32C31;--bad-soft:#FBEDED;--bad-line:#E3B3B6;
  --warn:#9A5B00;--warn-soft:#FFF4E0;--warn-line:#E8CFA0;--hi:#FFE27A;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 var(--sans)}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding-left:1.3em}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:15;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
.brand b{font-weight:900}
.tag-preview{font-size:.78rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);padding:2px 10px;border-radius:999px}
.progress{height:6px;background:#E7E3D8}
.progress i{display:block;height:100%;width:0;background:var(--wine);transition:width .3s}
main{padding:22px 0 120px}
h1{font-weight:900;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.25;color:var(--wine);letter-spacing:-.01em}
h2{font-weight:900;font-size:1.35rem;line-height:1.35;color:var(--wine)}
h3{font-weight:700;font-size:1.08rem;line-height:1.45}
.lead{color:var(--muted);margin-top:10px}
.fine{font-size:.88rem;color:var(--muted)}
.stack>*+*{margin-top:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(60,45,20,.06)}
.serif{font-family:var(--serif)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;width:100%}
.btn.pri{background:var(--wine);color:#fff}
.btn.pri:disabled{background:#B9A8AC;cursor:not-allowed}
.btn.line{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--wine);font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:44px}
.qid{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.q{font-family:var(--serif);font-size:1.3rem;line-height:1.6;margin-top:6px}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);margin:0 .15em;transform:translateY(2px)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 14px;background:#fff;border:1.5px solid #DDD8C8;border-radius:10px;text-align:left;cursor:pointer}
.opt:disabled,div.opt{cursor:default}
.opt .bub{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);font-weight:700;font-size:.92rem}
.opt .t{font-family:var(--serif);font-size:1.15rem;flex:1}
.opt .mk{font-size:.8rem;font-weight:700}
.opt[aria-pressed=true]{border-color:var(--wine);background:#FBF7EC}
.opt[aria-pressed=true] .bub{background:var(--wine);border-color:var(--wine);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .mk{color:var(--bad)}
.conf{margin-top:16px}
.conf p{font-size:.95rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.seg button{min-height:48px;border-radius:10px;border:1.5px solid #DDD8C8;background:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--wine);background:var(--wine);color:#fff}
.actions{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,rgba(247,243,232,0));margin-top:8px}
.fb{margin-top:18px;padding:16px;border-radius:10px;background:#FBF7EC;border-left:4px solid var(--ink);display:grid;gap:8px;font-size:.98rem}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .work{font-weight:700}
.fb b{margin-right:.5em}
.fb .sent b{margin-right:0}
.actions.static{position:static;background:none}
details.more{margin-top:4px}
details.more summary{cursor:pointer;color:var(--wine);font-weight:700;min-height:40px;display:flex;align-items:center}
details.more ul{margin-top:6px}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.maybe{background:var(--warn-soft);color:var(--warn)}
.dir{border-left:4px solid var(--wine);padding:14px 16px;background:#fff;border-radius:10px}
.dir h3{color:var(--wine)}
.dir p{margin-top:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:10px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.tbl th{color:var(--muted);font-weight:700;font-size:.85rem}
.vid{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#2E2A26}
#afterVideo{display:grid;gap:4px}
#app{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;padding:14px max(18px,calc((100vw - 684px)/2)) calc(14px + env(safe-area-inset-bottom))}
.fb #toDemo{margin-top:4px}
.fb .demo{margin-top:4px}
.fbmore{display:grid;gap:8px;margin-top:8px}
.fbmore ul{margin:4px 0 0 1.2em}
.steps{display:grid;gap:8px;counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:10px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--wine);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;margin-top:2px}
.demo .reveal{margin-top:14px}
.demo ol.how{margin-top:12px;display:grid;gap:6px}
.demo .ans{margin-top:10px;font-weight:700;color:var(--ok)}
.demo .ex{margin-top:6px;color:var(--muted);font-size:.95rem}
.score{font-size:2.6rem;font-weight:900;color:var(--wine);line-height:1.2}
.review-item{padding:12px 0;border-bottom:1px solid var(--line)}
.review-item:last-child{border-bottom:0}
.review-item .q{font-size:1.05rem}
.review-item p{font-size:.95rem;margin-top:4px}
#dbg{position:fixed;right:8px;top:64px;z-index:80;max-width:min(260px,70vw);background:#262626;color:#fff;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:10px;opacity:.88;pointer-events:none}
#dbg b{color:var(--hi)}
.say{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--wine);background:#fff;color:var(--wine);font:700 .9rem var(--sans);cursor:pointer;flex:none}
.say.ico{width:40px;min-height:40px;padding:0;font-size:1rem}
.say[aria-pressed="true"]{background:var(--wine);color:#fff}
.sent{margin-top:4px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;gap:6px}
.sent .en{font-family:var(--serif);font-size:1.12rem;line-height:1.5}
.sent .en b{color:var(--wine)}
.sentfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sent .zh{color:var(--muted);font-size:.95rem}
.ansline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
div.opt .t{flex:none}
div.opt .mk{margin-left:auto}
div.opt .say.ico{width:36px;min-height:36px;margin-left:-4px}
.fb .mv{border:2px solid var(--wine);border-radius:6px;padding:0 4px;font-weight:700}
.fb .contrast{display:block;margin-top:8px;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.fb .contrast .en{display:block;font-family:var(--serif);font-size:1.05rem;margin:4px 0}
</style>
</head>

<script>

/* ---------- 事件紀錄：沿用主站 logEvent 做法（Supabase events 表、同一分頁同一種事件只記一次、不含個人資料） ----------
   ?debug=1：右上角顯示事件清單，且「不」送出到資料庫，方便試走時確認而不影響正式數字。 */
var SB_URL='https://uzesrnvtbplloqqgmhcl.supabase.co';
var SB_KEY='sb_publishable_jrTIfxDHkliZJ8ySXIZyYg_jjKuA5I5';
var DEBUG=/[?&]debug=1\b/.test(location.search);
var sb=null,sbReady=null;
function initSb(){
  if(DEBUG)return Promise.resolve();
  sbReady=new Promise(function(ok){
    var t=document.createElement('script');
    t.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    t.onload=function(){try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}})}catch(e){}ok()};
    t.onerror=function(){ok()};
    document.head.appendChild(t);
  });
  return sbReady;
}
function dbg(name,state){
  if(!DEBUG)return;
  var d=document.getElementById('dbg');
  if(!d){d=document.createElement('div');d.id='dbg';d.innerHTML='<b>事件紀錄（debug，不送出）</b>';document.body.appendChild(d)}
  var r=document.createElement('div');r.textContent=name+' · '+state;r.setAttribute('data-ev',name);d.appendChild(r);
}
var EVENTS={pretest_start:'pos_pretest_start',pretest_done:'pos_pretest_done',trial_click:'pos_trial_click',l1_done:'pos_l1_done',day17_click:'pos_day17_click',l2_click:'pos_l2_click',l2_done:'pos_l2_done'};   // l2_done 只在 l2.html 使用
function logEvent(name){
  var p=Promise.resolve();
  try{
    var k='ev_'+name;
    if(sessionStorage.getItem(k)){dbg(name,'本分頁已記過');return p}
    sessionStorage.setItem(k,'1');
  }catch(e){}
  if(DEBUG){dbg(name,'記錄');return p}
  return (sbReady||Promise.resolve()).then(function(){
    if(!sb)return;
    return sb.from('events').insert({name:name}).then(function(){},function(){});
  }).catch(function(){});
}

/* ---------- 題目資料（前測 v2、第1課 v3 試測稿；ID 與正解以這兩份文件為準） ---------- */
var LET=['A','B','C','D'];
var CAT={
  NOUN:'名詞位置',ADJ_N:'名詞前的形容詞',ADV_V:'修飾動詞的副詞',
  ADV_MOD:'修飾形容詞或副詞的副詞',LINK_ADJ:'連綴動詞後的形容詞補語',MAIN_V:'主要動詞位置'
};
var CAT_ORDER=['ADJ_N','ADV_V','ADV_MOD','LINK_ADJ','NOUN','MAIN_V'];
var PRE=[
 {id:'P5-PRE-001',s:'The company launched a ______ advertising campaign last month.',o:['success','successful','successfully','succeed'],a:1,c:'ADJ_N',w:'先找中心名詞 campaign；空格描述活動是否成功，所以用形容詞 successful。'},
 {id:'P5-PRE-002',s:'All expense claims require the manager’s ______ before payment.',o:['approved','approve','approvingly','approval'],a:3,c:'NOUN',w:'require 後需要受詞，the manager’s 後要接名詞片語的中心詞，approval 是「核准」。'},
 {id:'P5-PRE-003',s:'Please read the safety instructions ______ before using the machine.',o:['care','careful','carefully','caring'],a:2,c:'ADV_V',w:'read 已有受詞 the safety instructions，空格補充「如何閱讀」，所以用副詞 carefully。'},
 {id:'P5-PRE-004',s:'The final proposal seems ______ to both departments.',o:['acceptable','accept','acceptably','acceptance'],a:0,c:'LINK_ADJ',w:'seems 是連綴動詞，空格描述主詞 proposal 的性質，所以用形容詞 acceptable。'},
 {id:'P5-PRE-005',s:'The report provides ______ useful information about customer preferences.',o:['surprising','surprise','surprises','surprisingly'],a:3,c:'ADV_MOD',w:'useful 已在修飾 information，空格修飾 useful，構成 surprisingly useful。'},
 {id:'P5-PRE-006',s:'The new software ______ routine tasks for the accounting team.',o:['automation','automates','automatic','automatically'],a:1,c:'MAIN_V',w:'句子有主詞和受詞，但缺少主要動詞；automates 能連接兩者，也符合單數主詞。'},
 {id:'P5-PRE-007',s:'The marketing team discussed the ______ of the new product.',o:['popularity','popular','popularly','popularize'],a:0,c:'NOUN',w:'the ______ of the new product 構成名詞片語，空格需要中心名詞 popularity。'},
 {id:'P5-PRE-008',s:'Sales have ______ improved since the new manager arrived.',o:['steady','steadiness','steadily','steadied'],a:2,c:'ADV_V',w:'空格在助動詞 have 和主要動詞 improved 之間，說明改善的方式，所以用副詞 steadily。'},
 {id:'P5-PRE-009',s:'The hotel offers a ______ shuttle service for guests.',o:['reliable','reliably','reliability','rely'],a:0,c:'ADJ_N',w:'shuttle service 是名詞片語，空格描述服務的性質，所以用形容詞 reliable。'},
 {id:'P5-PRE-010',s:'The revised instructions are ______ easier to follow.',o:['considerable','considerably','consideration','consider'],a:1,c:'ADV_MOD',w:'easier 是比較級形容詞，空格表達容易的程度差異，所以用副詞 considerably。'},
 {id:'P5-PRE-011',s:'Please contact the hotel for ______ about room availability.',o:['inform','informative','informatively','information'],a:3,c:'NOUN',w:'for 後需要名詞片語當受詞，information 是中心名詞，about room availability 補充內容。'},
 {id:'P5-PRE-012',s:'The new schedule seems ______ for most employees.',o:['suitability','suitably','suitable','suit'],a:2,c:'LINK_ADJ',w:'seems 後需要描述主詞 schedule 的補語，suitable for 表示「適合」。'},
 {id:'P5-PRE-013',s:'The committee made a ______ decision after reviewing all the proposals.',o:['finally','final','finality','finalize'],a:1,c:'ADJ_N',w:'decision 是中心名詞，空格描述是哪一種決定，所以用形容詞 final。'},
 {id:'P5-PRE-014',s:'The technician explained the new procedure ______.',o:['clearly','clear','clarity','clarify'],a:0,c:'ADV_V',w:'主詞、動詞、受詞已齊全，空格說明「如何解釋」，所以用副詞 clearly。'},
 {id:'P5-PRE-015',s:'Our customer service team ______ to inquiries within one business day.',o:['response','responsive','responds','responsively'],a:2,c:'MAIN_V',w:'空格需要主要動詞；responds to inquiries 表示「回覆詢問」。'}

var DEMOS=[{"id": "L6-DEMO-01", "t": "示範1　連接詞＋子句", "s": "______ the store opened only last month, it already has many regular customers.", "o": ["Despite", "Although", "However", "Due to"], "a": 1, "how": ["沒有句號，看空格後面：the store opened only last month，有主詞 the store、有動詞 opened → 子句。", "子句前面用連接詞 → Although。"], "ex": "排除：(A) Despite：介系詞，後面不能接子句。(C) However：副詞，不能把兩個子句連成一句。(D) Due to：介系詞片語，後面不能接子句；意思也不對。", "zh": "雖然這家店上個月才開幕，已經有很多常客了。"}, {"id": "L6-DEMO-02", "t": "示範2　介系詞＋名詞片語", "s": "______ the high price, the new phone sold out within a week.", "o": ["Even though", "Nevertheless", "Despite", "Because"], "a": 2, "how": ["空格後面 the high price：本題的 the high price 是名詞片語。", "名詞片語前面用介系詞 → Despite。"], "ex": "排除：(A) Even though：連接詞，後面要接子句。(B) Nevertheless：副詞，後面不接名詞片語。(D) Because：連接詞，後面要接子句；意思也不對。", "zh": "儘管價格很高，新手機一週內就賣光了。"}, {"id": "L6-DEMO-03", "t": "示範3　句號後的連接副詞", "s": "Sales dropped in the first quarter. ______, the company met its annual target.", "o": ["Although", "In spite of", "Nevertheless", "Because of"], "a": 2, "how": ["前一句已經用句號結束。", "空格在下一句開頭，後面接逗號 → 連接副詞。", "前後意思相反（銷售下滑，仍達成目標）→ 轉折 → Nevertheless。"], "ex": "排除：(A) Although：連接詞要把兩個子句連在同一句，不能放在句號後再接逗號。(B) In spite of：介系詞片語，後面要接名詞片語。(D) Because of：介系詞片語，後面要接名詞片語；意思也不對。", "zh": "第一季銷售下滑。儘管如此，公司仍達成了年度目標。"}, {"id": "L6-DEMO-04", "t": "示範4　because 還是 because of", "s": "The outdoor concert was canceled ______ the strong winds.", "o": ["because", "because of", "therefore", "although"], "a": 1, "how": ["空格後面 the strong winds：本題的 the strong winds 是名詞片語。", "表示原因，接名詞片語 → because of。"], "ex": "排除：(A) because：連接詞，後面要接子句（because the winds were strong）。(C) therefore：連接副詞，不能直接接名詞片語。(D) although：連接詞，要接子句；意思也不對。", "zh": "戶外音樂會因為強風取消了。"}];

/* ---------- 小工具 ---------- */
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function stem(s){return esc(s).replace('______','<span class="blank" aria-label="空格"></span>')}
function prog(p){var b=document.getElementById('prog');if(p==null){b.hidden=true;return}b.hidden=false;b.firstChild.style.width=Math.round(p*100)+'%'}
function render(html){stopSpeak();app.innerHTML=html;window.scrollTo(0,0)}
/* ---------- 發音：作答／揭曉後可聽「正解單字」與「完整句子」 ----------
   音檔是 ../audio/<srHash(文字)>.mp3，和主站、搭配詞卡共用（Generate audio 依 pos/audio-texts.json 產生） */
function srHash(str){
  var h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0;i<str.length;i++){var ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function fullSent(q){return q.s.replace('______',q.o[q.a])}
var audioEl=null,playingKey=null;
function setPressed(){document.querySelectorAll('.say').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.key===playingKey)})}
function stopSpeak(){
  try{if(audioEl){audioEl.pause();audioEl.removeAttribute('src');audioEl.load()}}catch(e){}
  audioEl=null;playingKey=null;setPressed();
}
function speak(text,key){
  if(playingKey===key){stopSpeak();return}
  stopSpeak();
  var a;try{a=new Audio('../audio/'+srHash(text)+'.mp3')}catch(e){return}
  audioEl=a;playingKey=key;setPressed();
  var done=function(){if(audioEl===a){audioEl=null;playingKey=null;setPressed()}};
  a.addEventListener('ended',done);a.addEventListener('error',done);
  var pr=a.play();if(pr&&pr.catch)pr.catch(done);
  window.__lastSpoken={text:text,key:key,src:a.src};
}
function sayBtn(text,key,label){return '<button type="button" class="say" data-say="'+esc(text)+'" data-key="'+esc(key)+'" aria-pressed="false">🔊 '+label+'</button>'}
function sayIcon(text,key){return '<button type="button" class="say ico" data-say="'+esc(text)+'" data-key="'+esc(key)+'" aria-label="聽 '+esc(text)+'" aria-pressed="false">🔊</button>'}
/* 完整句子（正解填回、加粗）＋聽整句＋中文翻譯 */
function sentHTML(q){
  var p=q.s.split('______');
  return '<div class="sent"><p class="en">'+esc(p[0])+'<b>'+esc(q.o[q.a])+'</b>'+esc(p[1]||'')+'</p>'+
    '<div class="sentfoot">'+(q.zh?'<p class="zh">'+esc(q.zh)+'</p>':'<span></span>')+sayBtn(fullSent(q),q.id+':s','聽整句')+'</div></div>';
}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-say]');if(b){e.preventDefault();speak(b.getAttribute('data-say'),b.getAttribute('data-key'))}});
function h(id){return document.getElementById(id)}
function optsHTML(q,picked,reveal){
  return '<div class="opts" role="group" aria-label="選項">'+q.o.map(function(t,k){
    var cls='opt',mk='';
    if(reveal){if(k===q.a){cls+=' right';mk='<span class="mk">正解</span>'}else if(k===picked){cls+=' wrong';mk='<span class="mk">你的選擇</span>'}}
    if(reveal)return '<div class="'+cls+'" data-k="'+k+'"><span class="bub">'+LET[k]+'</span><span class="t">'+esc(t)+'</span>'+sayIcon(t,q.id+':o'+k)+mk+'</div>';
    return '<button type="button" class="'+cls+'" data-k="'+k+'" aria-pressed="'+(picked===k)+'"><span class="bub">'+LET[k]+'</span><span class="t">'+esc(t)+'</span>'+mk+'</button>';
  }).join('')+'</div>';
}
function confHTML(v){
  return '<div class="conf"><p>這題你：</p><div class="seg" role="group" aria-label="信心">'+
    '<button type="button" data-conf="sure" aria-pressed="'+(v==='sure')+'">有把握</button>'+
    '<button type="button" data-conf="unsure" aria-pressed="'+(v==='unsure')+'">不確定</button></div></div>';
}
function bindPick(onChange){
  app.querySelectorAll('.opt[data-k]').forEach(function(b){b.addEventListener('click',function(){onChange('k',+b.dataset.k)})});
  app.querySelectorAll('[data-conf]').forEach(function(b){b.addEventListener('click',function(){onChange('conf',b.dataset.conf)})});
}

/* ---------- 2. 前測作答 ---------- */
function viewPre(){
  var i=st.pre.i,q=PRE[i],a=st.pre.ans[q.id]||{};
  prog(i/PRE.length);
  render('<div class="sheet"><div class="qid">第 '+(i+1)+' / '+PRE.length+' 題</div>'+
    '<p class="q">'+stem(q.s)+'</p>'+optsHTML(q,a.k,false)+confHTML(a.conf)+'</div>'+
    '<div class="actions"><button class="btn pri" id="next"'+(a.k==null||!a.conf?' disabled':'')+'>'+(i===PRE.length-1?'看結果':'下一題')+'</button>'+
    (i>0?'<p style="text-align:center"><button class="link" id="prev">上一題</button></p>':'')+'</div>');
  bindPick(function(f,v){var r=st.pre.ans[q.id]=st.pre.ans[q.id]||{};r[f]=v;viewPre()});
  h('next').addEventListener('click',function(){
    if(i<PRE.length-1){st.pre.i++;viewPre()}else{logEvent(EVENTS.pretest_done);viewResult()}
  });
  if(h('prev'))h('prev').addEventListener('click',function(){st.pre.i--;viewPre()});
}

/* ---------- 3. 結果與建議（依前測 v2 結果頁規格） ---------- */
function analyze(){
  var cats={};
  CAT_ORDER.forEach(function(c){cats[c]={c:c,n:0,right:0,wrong:0,wrongSure:0,rightUnsure:0}});
  PRE.forEach(function(q){
    var a=st.pre.ans[q.id],x=cats[q.c];x.n++;
    var ok=a.k===q.a;
    if(ok){x.right++;if(a.conf==='unsure')x.rightUnsure++}else{x.wrong++;if(a.conf==='sure')x.wrongSure++}
  });
  var list=CAT_ORDER.map(function(c){return cats[c]});
  var weak=list.filter(function(x){return x.wrong>0}).sort(function(p,q){
    return (q.wrong/q.n-p.wrong/p.n)||(q.wrongSure-p.wrongSure)||(CAT_ORDER.indexOf(p.c)-CAT_ORDER.indexOf(q.c));
  }).slice(0,2);
  var unsure=list.filter(function(x){return x.wrong===0&&x.rightUnsure>0});
  return {list:list,weak:weak,unsure:unsure};
}
function evidence(x){
  return '這次相關 '+x.n+' 題中，你答對 '+x.right+' 題'+(x.wrongSure?'，其中 '+x.wrongSure+' 題答錯時有把握':'')+'。';
}

  LINK_ADJ:'建議先找出連綴動詞，確認空格是在描述主詞，還是在說明動作。',
  NOUN:'建議先找出冠詞、所有格或介系詞，確認後面是否還缺名詞片語的中心。',
  MAIN_V:'建議先確認句子有沒有主要動詞，再看選項中哪一個能當主要動詞。'
};
/* 依最需要練的方向推薦課程：形容詞／副詞 → 第 1 課；名詞 → 第 2 課；主要動詞 → 第 3 課（第 1～3 課免費試學） */
var LESSON_OF={ADJ_N:1,ADV_V:1,ADV_MOD:1,LINK_ADJ:1,NOUN:2,MAIN_V:3};
var LESSONS={
  1:{href:null,btn:'免費試學第 1 課：形容詞與副詞怎麼選'},
  2:{href:'l2.html',btn:'免費試學第 2 課：先找中心名詞'},
  3:{href:'l3.html',btn:'免費試學第 3 課：先看句子缺不缺主要動詞'}
};
function recLesson(R){return R.weak.length?LESSON_OF[R.weak[0].c]:1}
function lessonLink(R){
  var codes=R.weak.map(function(x){return x.c});
  var has=function(c){return codes.indexOf(c)>=0};
  var rec=recLesson(R),t;
  if(rec===2)t='名詞位置可以直接看免費第 2 課：先找中心名詞，判斷空格是不是名詞。';
  else if(rec===3)t='主要動詞可以直接看免費第 3 課：先看句子缺不缺主要動詞，再決定動詞的形式。';
  else if(has('ADJ_N')||has('ADV_V')||has('ADV_MOD'))t='你的情況可以直接從免費第 1 課開始：第 1 課示範形容詞與副詞怎麼選。';
  else if(has('LINK_ADJ'))t='免費第 1 課的示範 4，會比較「描述主詞」和「描述動作」，正好可以先練。';
  else if(R.unsure.length)return '這次沒有答錯，但有不確定的題目。可以用第 1 課的判斷步驟再確認一次。';
  else return '這次表現穩定。可以用第 1 課確認判斷步驟，或直接繼續 Day 1–7 免費體驗。';
  var other=R.weak.slice(1).map(function(x){return LESSON_OF[x.c]}).filter(function(n){return n!==rec})[0];
  if(other)t+='另一個方向可以接著看第 '+other+' 課。';
  return t;
}
function viewResult(){
  prog(null);
  var R=analyze(),total=0,rec=recLesson(R);
  PRE.forEach(function(q){if(st.pre.ans[q.id].k===q.a)total++});
  var dirs='';
  if(R.weak.length){
    dirs=R.weak.map(function(x){
      var head=x.wrong===1?'這一題值得複習：'+CAT[x.c]:'建議優先練習：'+CAT[x.c];
      return '<div class="dir"><h3>'+head+'</h3><p>'+evidence(x)+TIP[x.c]+'</p></div>';
    }).join('');
  }else if(R.unsure.length){
    dirs='<div class="dir"><h3>建議確認練習</h3><p>這次全部答對，但在「'+R.unsure.map(function(x){return CAT[x.c]}).join('、')+'」有不確定的題目。建議再練一組，確認判斷方式。</p></div>';
  }else{
    dirs='<div class="dir"><h3>本次表現穩定</h3><p>15 題都答對且有把握。可以試學第 1 課確認判斷步驟，或接著練其他閱讀題型。</p></div>';
  }
  var rows=R.list.map(function(x){return '<tr><td>'+CAT[x.c]+'</td><td>'+x.right+' / '+x.n+'</td></tr>'}).join('');
  var review=PRE.map(function(q,i){
    var a=st.pre.ans[q.id],ok=a.k===q.a;
    var pill=ok?(a.conf==='unsure'?'<span class="pill maybe">答對・不確定</span>':'<span class="pill ok">答對</span>'):(a.conf==='sure'?'<span class="pill bad">答錯・有把握</span>':'<span class="pill bad">答錯</span>');
    return '<div class="review-item"><div class="qid">第 '+(i+1)+' 題 · '+CAT[q.c]+' '+pill+'</div><p class="q">'+stem(q.s)+'</p>'+
      '<p class="ansline">正解：('+LET[q.a]+') '+esc(q.o[q.a])+sayIcon(q.o[q.a],q.id+':w')+(ok?'':'　你選：('+LET[a.k]+') '+esc(q.o[a.k]))+'</p>'+sentHTML(q)+'<p class="fine">'+esc(q.w)+'</p></div>';
  }).join('');
  render('<div class="stack">'+
    '<h1>你的前測結果</h1>'+
    '<p class="lead">這次 15 題答對 '+total+' 題。下面是建議先練的方向（最多兩項）。這份結果用來安排練習，不換算多益分數。</p>'+
    dirs+
    '<div class="sheet"><h3>下一步</h3><p style="margin-top:6px">'+lessonLink(R)+'</p>'+
      '<p class="fine" style="margin-top:4px">第 1～3 課免費試學</p>'+
      (rec===1?'<div style="margin-top:14px"><button class="btn pri" id="trial">'+LESSONS[1].btn+'</button></div>':
        '<div class="stack" style="margin-top:14px"><a class="btn pri" id="recLesson" href="'+LESSONS[rec].href+'">'+LESSONS[rec].btn+'</a>'+
        '<button class="btn line" id="trial">或從第 1 課開始</button></div>')+'</div>'+
    '<div class="sheet"><h3>各類作答情況</h3><table class="tbl"><thead><tr><th>類別</th><th>答對</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<p class="fine" style="margin-top:8px">每類只有 2～3 題，只能當作初步線索。</p></div>'+
    '<details class="sheet more"><summary>看每一題的答案與判斷</summary>'+review+'</details>'+
  '</div>');
  h('trial').addEventListener('click',function(){logEvent(EVENTS.trial_click);viewLesson()});
}

/* ---------- 4. 免費第1課 ---------- */
function demoHTML(d,open){
  return '<div class="sheet demo" id="'+d.id+'"><div class="qid">'+d.id+'</div><h3>'+d.t+'</h3>'+
    '<p class="q">'+stem(d.s)+'</p><p class="serif" style="margin-top:6px">'+d.o.map(function(t,k){return '('+LET[k]+') '+esc(t)}).join('　')+'</p>'+
    '<div class="reveal"'+(open?' hidden':'')+'><button class="btn line" data-reveal="'+d.id+'">先想一下，再看老師怎麼判斷</button></div>'+
    '<div class="body"'+(open?'':' hidden')+'><ol class="how">'+d.how.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>'+
    '<p class="ans ansline">答案：('+LET[d.a]+') '+esc(d.o[d.a])+sayIcon(d.o[d.a],d.id+':w')+'</p>'+sentHTML(d)+'<p class="ex">'+esc(d.ex)+'</p></div></div>';
}
function bindReveal(){
  app.querySelectorAll('[data-reveal]').forEach(function(b){b.addEventListener('click',function(){
    var box=h(b.dataset.reveal);box.querySelector('.reveal').hidden=true;box.querySelector('.body').hidden=false;
  })});
}
function viewLesson(){
  prog(null);
  render('<div class="stack">'+
    '<div class="qid">詞性小課 第 6 課（完整方案）</div>'+
    '<h1>意思相近，怎麼選？看句型，也看標點</h1>'+
    '<video id="l1video" class="vid" controls playsinline preload="metadata" poster="lesson6-poster.jpg" src="lesson6.mp4">你的瀏覽器無法播放影片，可以直接往下看文字版重點。</video>'+
    '<p class="fine">約 7 分鐘：先考你三句，再教判斷觀念＋四個示範。</p>'+
    '<div id="afterVideo"><button class="btn pri" id="toPr">開始練習（10 題）</button>'+
      '<p style="text-align:center"><button class="link" id="toText">看文字版</button></p></div>'+
    '<details class="sheet more" id="textVersion"><summary>影片重點文字版（判斷觀念與四個示範）</summary><div class="stack" style="margin-top:12px">'+
    '<div class="sheet stack"><h2>先懂一件事：意思相近，看句型，也看標點</h2>'+
      '<h3>(1) 雖然、儘管：看後面接什麼</h3>'+
      '<table class="tbl"><thead><tr><th>後面接子句（主詞＋動詞）</th><th>後面接名詞片語</th></tr></thead><tbody>'+
      '<tr><td>although、even though、though</td><td>despite、in spite of</td></tr></tbody></table>'+
      '<p>Although <b>it was raining</b> heavily, …／Despite <b>the heavy rain</b>, …</p>'+
      '<p class="fine">despite ＝ in spite of；despite of 是錯的，常出現在錯誤選項。本課先練完整子句與名詞片語的對照；despite／in spite of 也可以接 V-ing，連接詞另有省略結構，後續再學。</p>'+
      '<h3>(2) 兩個完整句子：連接副詞／副詞片語</h3>'+
      '<p>It was raining heavily. <b>Nevertheless</b>, the flight departed on time.</p>'+
      '<table class="tbl"><thead><tr><th>意思</th><th>句號或分號後，接逗號</th></tr></thead><tbody>'+
      '<tr><td>轉折</td><td>however、nevertheless、nonetheless</td></tr>'+
      '<tr><td>結果</td><td>therefore、as a result</td></tr></tbody></table>'+
      '<p class="fine">but 是連接詞，可以用逗號連兩個子句；however、nevertheless 不是連接詞，所以前面要用分號或句號。</p>'+
      '<h3>(3) 因為：because 和 because of</h3>'+
      '<p>The order arrived late <b>because</b> the shipment was delayed.<br>The order arrived late <b>because of</b> the delay.</p>'+
      '<p class="fine">因為貨運延誤，訂購的貨品晚到了。</p>'+
      '<h3>判斷三步驟</h3><ol class="steps">'+
      '<li>先看選項與句意：讓步、原因、結果，還是時間？</li>'+
      '<li>看空格前後的標點與子句：「完整句子。／；______，完整句子」→ 連接副詞；兩個子句只用逗號 → but、so。</li>'+
      '<li>其餘看後接結構：完整子句 → 連接詞；名詞片語 → 介系詞。最後代回確認句意。</li></ol></div>'+
    '<h2>看老師怎麼判斷</h2>'+
    DEMOS.map(function(d){return demoHTML(d,false)}).join('')+
    '<div class="sheet stack"><h3>本課整理：出現過的字</h3><table class="tbl"><thead><tr><th>意思</th><th>＋子句（連接詞）</th><th>＋名詞片語／V-ing（介系詞）</th><th>句號／分號＋___，（連接副詞）</th></tr></thead><tbody>'+
      '<tr><td>讓步／轉折</td><td>although、even though、though</td><td>despite ＝ in spite of</td><td>however、nevertheless ＝ nonetheless</td></tr>'+
      '<tr><td>原因</td><td>because、since</td><td>because of、due to</td><td>—</td></tr>'+
      '<tr><td>結果</td><td>—</td><td>—</td><td>therefore、as a result</td></tr>'+
      '<tr><td>時間</td><td>while</td><td>during</td><td>—</td></tr></tbody></table>'+
      '<p class="fine">兩個子句只用逗號連起來 → but、so（連接詞）。however、nevertheless 不是連接詞，所以前面要用分號或句號。</p></div>'+
    '<button class="btn line" id="toPr2">開始 10 題練習</button></div></details>'+
  '</div>');
  bindReveal();
  function start(){st.pr.i=0;viewItem('pr')}
  h('toPr').addEventListener('click',start);
  h('toPr2').addEventListener('click',start);
  h('toText').addEventListener('click',function(){var t=h('textVersion');t.open=true;t.scrollIntoView({block:'start'})});
  h('l1video').addEventListener('ended',function(){var a=h('afterVideo');if(a)a.scrollIntoView({behavior:'smooth',block:'center'})});
}

/* ---------- 5. 練習與確認（共用作答畫面） ---------- */
function feedbackHTML(q,k,kind){
  var ok=k===q.a;
  var others=q.x.map(function(t,j){return (t&&j!==k)?'<li>'+esc(t)+'</li>':''}).join('');
  return '<div class="fb '+(ok?'ok':'bad')+'" id="fb">'+
    '<div><b>'+(ok?'答對了！':'正解是 ('+LET[q.a]+') '+esc(q.o[q.a]))+'</b>'+(q.whyHtml||esc(q.why))+'</div>'+
    (kind==='chk'&&!ok?'<button class="btn line" id="toDemo">看同類示範（示範'+(q.demo+1)+'）</button>'+
      '<div id="demoBox" hidden>'+demoHTML(DEMOS[q.demo],true)+'</div>':'')+
    '<details class="more" id="fullFb"><summary>看完整解析</summary><div class="fbmore">'+
      '<div class="work">空格的工作：'+esc(q.work)+'</div>'+
      (ok?'':'<div>你選的 '+esc(q.x[k])+'</div>')+sentHTML(q)+
      (others?'<div><div class="work">其他選項</div><ul>'+others+'</ul></div>':'')+
    '</div></details>'+
  '</div>';
}
function viewItem(kind,fresh){
  var set=kind==='pr'?PR:CHK,s=st[kind],i=s.i,q=set[i],a=s.ans[q.id]||{},done=a.done;
  prog(kind==='pr'?(i/(PR.length+CHK.length)):((PR.length+i)/(PR.length+CHK.length)));
  var label=kind==='pr'?'練習 第 '+(i+1)+' / '+PR.length+' 題':'確認 第 '+(i+1)+' / '+CHK.length+' 題';
  var html='<div class="sheet"><div class="qid">'+label+' · '+q.id+'</div><p class="q">'+stem(q.s)+'</p>'+
    optsHTML(q,a.k,!!done)+(done?feedbackHTML(q,a.k,kind):'')+'</div>';   // 練習與確認題不問把握度（只有前測用來判讀）
  var last=i===set.length-1;
  var actions='<div class="actions">';
  if(!done){
    actions+='<button class="btn pri" id="submit"'+(a.k==null?' disabled':'')+'>確認答案</button>';
  }else{
    actions+='<button class="btn pri" id="next">'+(last?(kind==='pr'?'開始 4 題確認':'看完成畫面'):'下一題')+'</button>';
  }
  actions+='</div>';
  if(kind==='chk'&&i===0&&!done)html='<div class="sheet" style="margin-bottom:14px"><h3>確認是否學會</h3><p class="fine" style="margin-top:4px">4 題新題。答錯時可以直接在題目下方看同類示範。</p></div>'+html;
  render(html+actions);
  if(!done){
    bindPick(function(f,v){var r=s.ans[q.id]=s.ans[q.id]||{};r[f]=v;viewItem(kind)});
    h('submit').addEventListener('click',function(){
      a.done=true;
      if(kind==='chk'&&!(q.id in s.first))s.first[q.id]=a.k===q.a;
      viewItem(kind,true);
    });
  }else{
    if(h('toDemo'))h('toDemo').addEventListener('click',function(){var b=h('demoBox');b.hidden=!b.hidden;this.textContent=b.hidden?'看同類示範（示範'+(q.demo+1)+'）':'收起示範';if(!b.hidden)b.scrollIntoView({block:'start'})});
    if(fresh)h('fb').scrollIntoView({block:'nearest'});
    h('next').addEventListener('click',function(){
      if(!last){s.i++;viewItem(kind)}
      else if(kind==='pr'){st.chk.i=0;viewItem('chk')}
      else viewDone();
    });
  }
}

/* ---------- 6. 確認題答錯 → 回看示範 → 回到原題 ---------- */
function viewDemoJump(q){
  prog(null);
  var d=DEMOS[q.demo];
  render('<div class="stack"><p class="fine">你在 '+q.id+' 答錯了，先回看對應的示範：</p>'+demoHTML(d,true)+
    '<div class="actions"><button class="btn pri" id="back">回到原題 '+q.id+'</button></div></div>');
  h('back').addEventListener('click',function(){viewItem('chk')});
}

/* ---------- 7. 完成畫面 ---------- */
function viewDone(){
  prog(1);
  var x=0;CHK.forEach(function(q){if(st.chk.first[q.id])x++});
  render('<div class="stack">'+
    '<h1>第 6 課完成！</h1>'+
    '<div class="sheet stack"><p>你已經練習了「意思相近，先看句型和標點」的判斷方式。</p>'+
      '<p class="score">這次答對 '+x+'／4 題</p>'+
      '<p class="fine">以每題第一次作答計算。</p></div>'+
    '<div class="sheet stack"><h3>下一課</h3>'+
      '<a class="btn pri" id="nextl" href="l7.html">繼續第 7 課：who、which 還是 whose？</a></div>'+
    '<div class="sheet stack"><h3>想接著練其他閱讀題型？</h3>'+
      '<a class="btn line" id="d17" href="../#day1-7">繼續 Day 1–7 免費體驗</a></div>'+
    '<a class="btn line" href="../">回到 Score Rescue</a>'+
    '<p style="text-align:center"><button class="link" id="again">重看第 6 課</button></p>'+
  '</div>');
  h('again').addEventListener('click',viewLesson);
}

initSb();
viewLesson();
window.__pos={st:st,PR:PR,CHK:CHK,DEMOS:DEMOS,view:viewItem,sayTexts:function(){var o=[];[].concat(DEMOS,PR,CHK).forEach(function(q){o.push.apply(o,q.o);o.push(fullSent(q))});return o}};
})();
</script>
