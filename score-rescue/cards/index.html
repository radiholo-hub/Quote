<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多益副詞搭配詞卡</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* 版面：沿用 Score Rescue 的米白紙＋酒紅；上方分類籤，中間一張可翻面的卡，下方上一張／下一張與「記住了」 */
:root{
  --bg:#F7F3E8; --card:#FFFFFF; --ink:#262626; --muted:#5E5A52; --line:#E2DACA; --accent:#6B2D3C; --accent-soft:#F4E9EC;
  --ok:#1F653C; --ok-soft:#E6F2EA;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --en:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1A1B; --card:#2A2627; --ink:#F1ECE4; --muted:#B8B0A6; --line:#3E3839; --accent:#E3A3B2; --accent-soft:#3A2A2F;
  --ok:#8FD1A8; --ok-soft:#22352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1A1B; --card:#2A2627; --ink:#F1ECE4; --muted:#B8B0A6; --line:#3E3839; --accent:#E3A3B2; --accent-soft:#3A2A2F;
  --ok:#8FD1A8; --ok-soft:#22352A; color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
h1{font:900 1.5rem/1.3 var(--display);color:var(--accent);text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem;margin-top:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:.92rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tab small{font-weight:500;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
.catnote{margin-top:10px;font-size:.93rem;color:var(--muted)}
.catnote b{color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;padding:12px 0 20px;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{display:grid;perspective:1400px}
.face{position:relative;grid-area:1/1;min-height:330px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 2px 6px rgba(40,25,20,.07);padding:24px 22px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s ease}
.back{transform:rotateY(180deg)}
.card.flip .front{transform:rotateY(-180deg)}
.card.flip .back{transform:rotateY(0)}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
.lab{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.front .en{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:600 clamp(1.9rem,8vw,2.6rem)/1.25 var(--en);text-wrap:balance}
.front .en .pair{display:block;font-size:.6em;font-weight:500;color:var(--muted);margin-top:10px}
.hint{text-align:center;font-size:.88rem;color:var(--muted)}
.back .en{font:600 1.5rem/1.3 var(--en);margin-top:6px}
.back .zh{font:900 1.35rem/1.4 var(--display);color:var(--accent);margin-top:4px}
.back .ex{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.back .ex p{font:500 1.08rem/1.5 var(--en)}
.back .ex p b{color:var(--accent)}
.back .ex span{display:block;font:400 .93rem/1.5 var(--body);color:var(--muted)}
.back .tip{margin-top:auto;padding-top:12px;font-size:.9rem;color:var(--muted)}
.known .face{border-color:var(--ok)}
.badge{position:absolute;top:16px;right:16px;font-size:.78rem;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 10px;border-radius:999px}
.ctrl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
.btn{min-height:50px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.pri[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tools{display:flex;justify-content:center;gap:18px}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px;min-height:40px}
.say{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:700 .95rem var(--body);cursor:pointer}
.say[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.front .sayrow{display:flex;justify-content:center;margin-top:-6px;margin-bottom:10px}
.back .ex .line{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.back .ex .line .say{flex:none;min-height:40px;padding:0 12px;font-size:.85rem;margin-top:2px}
footer{border-top:1px solid var(--line);padding:14px 0 20px;font-size:.88rem;color:var(--muted)}
footer b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>多益副詞搭配詞卡</h1>
    <p class="sub">Part 5 常考的副詞搭配，分 5 類共 40 張。點卡片翻面看意思和例句；按 🔊 聽英文發音。</p>
    <div class="tabs" role="tablist" id="tabs" aria-label="分類"></div>
    <p class="catnote" id="catnote"></p>
  </header>
</div>
<main class="wrap">
  <div>
    <div class="meta"><span id="pos"></span><span id="knownCount"></span></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </div>
  <div class="card" id="card" tabindex="0" aria-label="單字卡，按 Enter 翻面">
    <div class="face front" id="front"></div>
    <div class="face back" id="back"></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="prev" type="button">上一張</button>
    <button class="btn pri" id="known" type="button" aria-pressed="false">記住了</button>
    <button class="btn" id="next" type="button">下一張</button>
  </div>
  <div class="tools">
    <button class="link" id="shuffle" type="button">打亂順序</button>
    <button class="link" id="onlyNew" type="button" aria-pressed="false">只看還沒記住的</button>
  </div>
</main>
<div class="wrap">
  <footer><b>Score Rescue｜詞性小課</b>　搭配第 1 課與《副詞四大類速查表》使用。例句皆為多益職場情境的原創句。</footer>
</div>

    "zh": "hard 努力地；hardly 幾乎不",
    "say": "hard, hardly",
    "ex": [
     [
      "She works **hard** every day.",
      "她每天都很努力工作。"
     ],
     [
      "He **hardly** had time to eat lunch.",
      "他幾乎沒時間吃午餐。"

    ],
    "audio": true
   },
   {
    "id": "look-02",
    "w": "late / lately",
    "p": "晚／最近",
    "zh": "late 晚；lately 最近",
    "say": "late, lately",
    "ex": [
     [
      "The train arrived **late**.",
      "火車晚到了。"
     ],
     [
      "Have you been busy **lately**?",
      "你最近忙嗎？"
     ]
    ],
    "tip": "lately 常搭配現在完成式。",
    "audio": true
   },
   {
    "id": "look-03",

    "p": "在附近／幾乎",
    "zh": "near 在附近；nearly 幾乎",
    "say": "near, nearly",
    "ex": [
     [

      "飯店在機場附近。"

   {

    "say": "high, highly",
    "ex": [
     [
      "Prices remain **high**.",
      "價格仍然很高。"
     ],
     [
      "The new method is **highly** effective.",
      "新方法非常有效。"
     ]
    ],
    "audio": true
   },
   {
    "id": "look-05",
    "w": "close / closely",
    "p": "近的／密切地",
    "zh": "close 近的；closely 密切地、仔細地",
    "say": "close, closely",
    "ex": [
     [
      "The office is **close** to the station.",
      "辦公室離車站很近。"
     ],
     [
      "Please follow the instructions **closely**.",
      "請仔細遵照說明。"
     ]
    ],
    "audio": true
   },
   {
    "id": "look-06",
    "w": "short / shortly",
    "p": "短的／不久",
    "zh": "short 短的；shortly 不久、很快",
    "say": "short, shortly",
    "ex": [
     [
      "The meeting was **short**.",
      "會議很短。"
     ],
     [
      "The manager will arrive **shortly**.",
      "經理很快就到。"

    ],

   {

    "w": "free / freely",
    "p": "免費／自由地",
    "zh": "free 免費；freely 自由地",
    "say": "free, freely",
    "ex": [
     [
      "Children under six travel **free**.",
      "六歲以下兒童免費搭乘。"
     ],
     [
      "Staff can share ideas **freely** at the meeting.",
      "員工可以在會議上自由分享想法。"

    ],

   },
   {
    "id": "look-08",
    "w": "most / mostly",
    "p": "最／大多",
    "zh": "most 最；mostly 大多、主要",
    "say": "most, mostly",
    "ex": [
     [
      "Which plan costs the **most**?",
      "哪個方案最貴？"
     ],
     [
      "The new hires are **mostly** recent graduates.",
      "新進員工大多是應屆畢業生。"
     ]
    ],

   }
  ]
 }

</script>
<script>
(function(){
'use strict';
/* 卡片資料在上方 cards-data（id 是卡片 ID；say＝正面「聽搭配詞」念的文字；ex＝[英文例句（**粗體**）, 中文]；audio＝已有 Aria 音檔）。
   發音檔沿用 Score Rescue 主站：../audio/<srHash(英文)>.mp3（tools/make_score_rescue_audio.py 產生，Aria、-8%）。 */
var CATS=JSON.parse(document.getElementById('cards-data').textContent);
function srHash(str){
  var h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0;i<str.length;i++){var ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function plain(s){return s.replace(/\*\*/g,'')}

/* 播放：同一時間只有一段聲音；再按一次同一顆＝停止；換卡、換分類時停止 */
var audioEl=null,playingKey=null;
function setPressed(){document.querySelectorAll('.say').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.key===playingKey)})}
function stopSpeak(){
  try{if(audioEl){audioEl.pause();audioEl.removeAttribute('src');audioEl.load()}}catch(e){}
  audioEl=null;playingKey=null;setPressed();
}
function speak(text,key){
  if(playingKey===key){stopSpeak();return}
  stopSpeak();
  var a;try{a=new Audio('../audio/'+srHash(text)+'.mp3')}catch(e){return}
  audioEl=a;playingKey=key;setPressed();
  var done=function(){if(audioEl===a){audioEl=null;playingKey=null;setPressed()}};
  a.addEventListener('ended',done);a.addEventListener('error',done);
  var pr=a.play();if(pr&&pr.catch)pr.catch(done);
  window.__lastSpoken={text:text,key:key,src:a.src};
}

var KEY='sr_colloc_known_v1';
var known={};
try{known=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){known={}}
function saveKnown(){try{localStorage.setItem(KEY,JSON.stringify(known))}catch(e){}}

var cat=0,order=[],i=0,onlyNew=false;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function card(c,k){return CATS[c].cards[k]}

function buildOrder(shuffle){
  var n=CATS[cat].cards.length,a=[];
  for(var k=0;k<n;k++){if(!onlyNew||!known[card(cat,k).id])a.push(k)}
  if(shuffle){for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[r];a[r]=t}}
  order=a;i=0;
}
function tabs(){
  $('tabs').innerHTML=CATS.map(function(c,k){
    var kn=c.cards.filter(function(d){return known[d.id]}).length;
    return '<button class="tab" role="tab" type="button" id="tab'+k+'" aria-selected="'+(k===cat)+'" data-k="'+k+'">'+esc(c.name)+'<small>'+kn+'/'+c.cards.length+'</small></button>';
  }).join('');
  $('catnote').innerHTML=CATS[cat].note;
}
function sayBtn(text,key,label){return '<button type="button" class="say" data-say="'+esc(text)+'" data-key="'+key+'" aria-pressed="false">🔊 '+label+'</button>'}
function show(){
  stopSpeak();
  var c=CATS[cat],el=$('card');
  el.classList.remove('flip');
  if(!order.length){
    $('front').innerHTML='<div class="lab">'+esc(c.name)+'</div><div class="en" style="font-size:1.3rem;font-family:var(--body)">這一類都記住了！</div><p class="hint">按「看全部」可以切回全部卡片。</p>';
    $('back').innerHTML='';el.classList.remove('known');
    $('pos').textContent='0 / 0';$('barFill').style.width='100%';
    $('known').disabled=true;$('prev').disabled=true;$('next').disabled=true;
    counts();return;
  }
  $('known').disabled=false;$('prev').disabled=false;$('next').disabled=false;
  var d=card(cat,order[i]),isK=!!known[d.id];
  el.dataset.id=d.id;
  $('front').innerHTML='<div class="lab">'+esc(c.name)+'</div><div class="en"><span>'+esc(d.w)+'<span class="pair">'+esc(d.p)+'</span></span></div>'+
    (d.audio?'<div class="sayrow">'+sayBtn(d.say,d.id+':w','聽搭配詞')+'</div>':'')+
    '<p class="hint">點一下卡片翻面</p>'+(isK?'<span class="badge">記住了</span>':'');
  $('back').innerHTML='<div class="lab">意思與例句</div><div class="en">'+esc(d.w)+'</div><div class="zh">'+esc(d.zh)+'</div>'+
    '<div class="ex">'+d.ex.map(function(e,j){return '<p><span class="line"><span class="t">'+bold(e[0])+'</span>'+(d.audio?sayBtn(plain(e[0]),d.id+':ex'+(j+1),'聽例句'):'')+'</span><span>'+esc(e[1])+'</span></p>'}).join('')+'</div>'+
    (d.tip?'<p class="tip">'+esc(d.tip)+'</p>':'')+(isK?'<span class="badge">記住了</span>':'');
  el.classList.toggle('known',isK);
  $('known').setAttribute('aria-pressed',isK);$('known').textContent=isK?'已記住 ✓':'記住了';
  $('pos').textContent=(i+1)+' / '+order.length;
  $('barFill').style.width=Math.round((i+1)/order.length*100)+'%';
  counts();
}
function counts(){
  var tot=0,kn=0;CATS.forEach(function(c){c.cards.forEach(function(d){tot++;if(known[d.id])kn++})});
  $('knownCount').textContent='全部記住 '+kn+' / '+tot;
}
function flip(){if(order.length)$('card').classList.toggle('flip')}
function go(d){if(!order.length)return;i=(i+d+order.length)%order.length;show()}

$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;cat=+b.dataset.k;buildOrder(false);tabs();show()});
$('card').addEventListener('click',function(e){
  var b=e.target.closest('.say');
  if(b){e.stopPropagation();speak(b.dataset.say,b.dataset.key);return}   // 按喇叭：只播放，卡片停在原面
  flip();
});
$('card').addEventListener('keydown',function(e){if(e.target!==this)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
$('prev').addEventListener('click',function(){go(-1)});
$('next').addEventListener('click',function(){go(1)});
$('known').addEventListener('click',function(){
  if(!order.length)return;var id=card(cat,order[i]).id;
  if(known[id])delete known[id];else known[id]=1;saveKnown();tabs();
  if(onlyNew&&known[id]){var keep=i;buildOrder(false);i=Math.min(keep,Math.max(0,order.length-1));show()}else{var f=$('card').classList.contains('flip');show();if(f)$('card').classList.add('flip')}
});
$('shuffle').addEventListener('click',function(){buildOrder(true);show()});
$('onlyNew').addEventListener('click',function(){onlyNew=!onlyNew;this.setAttribute('aria-pressed',onlyNew);this.textContent=onlyNew?'看全部':'只看還沒記住的';buildOrder(false);show()});
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('.tab,.say'))return;if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});

buildOrder(false);tabs();show();
window.__cards={CATS:CATS,srHash:srHash,stop:stopSpeak};
})();
</script>
</body>
</html>
