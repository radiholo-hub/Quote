<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學測英文練習</title>
<meta name="description" content="學測英文題型練習:詞彙、綜合測驗、閱讀測驗、篇章結構,附詳解與錯題本。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>學測英文練習</h1>
    <p class="sub">詞彙・綜合測驗・閱讀測驗・篇章結構</p>
  </header>

  <section id="home">
    <h2>歷屆學測英文</h2>
    <p class="fine">大考中心公布的選擇題(詞彙、綜合測驗、文意選填、篇章結構、閱讀測驗)。混合題與非選擇題需要人工批改,未收錄。</p>
    <div id="exams"></div>
    <h2>原創模擬題</h2>
    <div class="grid" id="types"></div>
    <div class="row">
      <button class="btn" id="mixed">詞彙隨機 10 題</button>
      <button class="btn line" id="wrongBtn">錯題本 <span id="wrongN">0</span></button>
    </div>
    <p class="fine" id="stats"></p>
    <p class="fine">歷屆試題來源:大學入學考試中心(106 至 115 學年度),版權屬該單位;模擬題為原創仿作。成績與錯題只存在這台裝置的瀏覽器。</p>
  </section>

  <section id="quiz" hidden>
    <div class="bar"><button class="link" id="quit">← 返回</button><span id="prog"></span></div>
    <div id="passage" class="passage" hidden></div>
    <div id="source" class="fine"></div>
    <div id="question"></div>
    <div id="opts" role="radiogroup"></div>
    <div id="explain" class="explain" hidden></div>
    <button class="btn" id="next" hidden>下一題</button>
  </section>

  <section id="result" hidden>
    <h2 id="score"></h2>
    <div id="review"></div>
    <p id="msg"></p>
    <div class="row">
      <button class="btn" id="again">再練一次</button>
      <button class="btn line" id="home2">回首頁</button>
    </div>
  </section>
</main>
<script src="questions.js"></script>
<script src="exams.js"></script>
<script src="answers.js"></script>
<script src="app.js"></script>
</body>
</html>
