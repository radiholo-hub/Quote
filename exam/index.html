<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國中會考英語考古題</title>
<meta name="description" content="國中教育會考考古題線上練習：依科目、年度篩選，作答後立即看解析，錯題自動收藏。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>國中會考 英語考古題</h1>
    <p class="tag">選題型、選年度，作答後立即看解析；答錯的題目自動收進錯題本。</p>
  </header>

  <section class="filters" aria-label="篩選">
    <label>題型
      <select id="f-subject"></select>
    </label>
    <label>年度
      <select id="f-year"></select>
    </label>
    <label>範圍
      <select id="f-mode">
        <option value="all">全部題目</option>
        <option value="todo">尚未作答</option>
        <option value="wrong">錯題本</option>
        <option value="star">標記複習</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="f-shuffle"> 隨機順序</label>
  </section>

  <p class="progress" id="progress"></p>

  <article class="card" id="card" aria-live="polite">
    <div class="qmeta" id="qmeta"></div>
    <div class="passage" id="passage" hidden></div>
    <div class="stem" id="stem"></div>
    <ol class="options" id="options"></ol>
    <div class="result" id="result" hidden></div>
  </article>

  <nav class="actions">
    <button id="prev">← 上一題</button>
    <button id="star">☆ 標記</button>
    <button id="next">下一題 →</button>
  </nav>

  <p class="stats" id="stats"></p>
  <p class="foot"><button id="reset" class="link">清除所有作答紀錄</button></p>
  <p class="note">題庫格式見 <code>questions.js</code>；請自行依官方公開試題補充（版權屬國立臺灣師範大學心理與教育測驗研究發展中心）。</p>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
