<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<!-- 直式短片（1080×1920）的畫面。make_video.py 依 json 的 "scene": "short.html" 使用這頁。 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F3E8;--ink:#262626;--muted:#5B5B5B;--wine:#6B2D3C;--blue:#1F5C99;--ok:#1E6B3A;--ok-soft:#E5F1E8;--bad:#A3262B;--line:#E4DCC6}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif}
.serif{font-family:"Source Serif 4","Noto Serif CJK TC",Georgia,serif}
#app{position:absolute;inset:0;padding:150px 80px 0}
.kick{font:700 42px/1.3 "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--wine);letter-spacing:.03em}
.h{margin-top:24px;font:900 96px/1.2 "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--wine)}
.h.md{font-size:80px}
.sub{margin-top:30px;font:500 48px/1.5 "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--muted)}
.card{position:absolute;left:80px;right:80px;top:560px}
.sents{margin-top:150px;display:grid;gap:90px}
.s{font-size:78px;line-height:1.35}
.s .n{font:700 52px "Noto Sans TC",sans-serif;color:var(--wine);margin-right:14px}
.zh{margin-top:22px;font:500 44px/1.4 "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--muted)}
.w{position:relative;display:inline-block;padding:0 12px;margin:0 2px}
.w.ring{outline:7px solid var(--c,var(--wine));outline-offset:4px;border-radius:60px}
.w .lab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 22px);white-space:nowrap;font:900 40px "Noto Sans TC",sans-serif;color:#fff;background:var(--c,var(--wine));padding:6px 22px;border-radius:999px}
.gap{display:block;height:96px}
.w.dimw{opacity:.28}
.blank{display:inline-block;min-width:230px;border-bottom:7px solid var(--ink);margin:0 8px;text-align:center}
.blank.fill{border-color:var(--ok);color:var(--ok);font-weight:600}
.opts{margin-top:70px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.o{display:flex;align-items:center;gap:22px;padding:22px 26px;background:#fff;border:3px solid #DDD8C8;border-radius:22px;font-size:58px}
.o b{flex:none;display:grid;place-items:center;width:70px;height:70px;border-radius:50%;border:3px solid var(--ink);font:700 38px "Noto Sans TC",sans-serif}
.o.right{border-color:var(--ok);background:var(--ok-soft)}.o.right b{background:var(--ok);border-color:var(--ok);color:#fff}
.o.dim{opacity:.4}
.cd{position:absolute;left:0;right:0;top:1500px;display:flex;justify-content:center;align-items:center;gap:30px;font:900 56px "Noto Sans TC",sans-serif;color:var(--wine)}
.cd i{font-style:normal;display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:var(--wine);color:#fff;font-size:90px}
.ban{position:absolute;left:80px;right:80px;top:1460px;padding:34px 40px;border-radius:28px;color:#fff;background:var(--c,var(--wine));font:900 54px/1.4 "Noto Sans TC","Noto Sans CJK TC",sans-serif;text-align:center}
.cta{position:absolute;left:80px;right:80px;top:1280px}
.cta .btn{background:var(--wine);color:#fff;border-radius:999px;padding:38px 40px;text-align:center;font:900 58px/1.3 "Noto Sans TC","Noto Sans CJK TC",sans-serif}
.cta .fine{margin-top:30px;text-align:center;font:500 44px "Noto Sans TC",sans-serif;color:var(--muted)}
.brand{position:absolute;bottom:110px;left:0;right:0;text-align:center;font:700 38px "Noto Sans TC",sans-serif;color:var(--muted)}
</style></head><body><div id="app"></div>
<script>
var BRAND='Score Rescue｜多益 Part 5 詞性小課';
var C={wine:'var(--wine)',blue:'var(--blue)',ok:'var(--ok)',red:'var(--bad)'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* 句子：[word] 是可圈的字，______ 是空格（fill 時填入答案） */
function sent(s,v){
  return esc(s).replace(/\[([^\]]+)\]/g,function(m,w){
    var r=(v.ring||[]).filter(function(x){return x.w===w})[0];
    var dm=(v.dim||[]).indexOf(w)>=0?' dimw':'';   // 淡化：主詞後面的介系詞片語
    return '<span class="w'+(r?' ring':'')+dm+'"'+(r?' style="--c:'+C[r.c||'wine']+'"':'')+'>'+w+(r&&r.label?'<span class="lab">'+esc(r.label)+'</span>':'')+'</span>';
  }).replace('______',function(){
    var r=(v.ring||[]).filter(function(x){return x.w==='blank'})[0],inner=v.fill?esc(v.fill):'&nbsp;';
    var b='<span class="blank'+(v.fill?' fill':'')+'">'+inner+'</span>';
    return r?'<span class="w ring" style="--c:'+C[r.c||'wine']+'">'+b+(r.label?'<span class="lab">'+esc(r.label)+'</span>':'')+'</span>':b;
  }).replace(/\|/g,'<span class="gap"></span>');
}
function render(v,n){
  var h='';
  if(v.kind==='card'){
    h='<div class="card"'+(v.top?' style="top:'+v.top+'px"':'')+'>'+(v.kick?'<div class="kick">'+esc(v.kick)+'</div>':'')+'<div class="h'+(v.md?' md':'')+'">'+v.h+'</div>'+(v.sub?'<div class="sub">'+v.sub+'</div>':'')+'</div>';
    if(v.cta)h+='<div class="cta"><div class="btn">免費做 15 題詞性前測</div><div class="fine">連結在個人檔案</div></div>';
  }else{
    h='<div class="kick">'+esc(v.t||'')+'</div><div class="sents">'+v.lines.map(function(L){
      return '<div><div class="s serif"'+((v.lh||v.fs)?' style="'+(v.lh?'line-height:'+v.lh+';':'')+(v.fs?'font-size:'+v.fs+'px':'')+'"':'')+'>'+(L.n?'<span class="n">'+L.n+'</span>':'')+sent(L.s,v)+'</div>'+(L.zh&&v.showzh?'<div class="zh">'+esc(L.zh)+'</div>':'')+'</div>';
    }).join('')+'</div>';
    if(v.o)h+='<div class="opts">'+v.o.map(function(t,k){var cl='o serif'+(v.ans==null?'':(k===v.ans?' right':' dim'));return '<div class="'+cl+'"><b>'+'ABCD'[k]+'</b>'+esc(t)+'</div>'}).join('')+'</div>';
    if(n)h+='<div class="cd">先想一想 <i>'+n+'</i></div>';
    if(v.ban)h+='<div class="ban" style="--c:'+C[v.ban.c||'wine']+'">'+v.ban.t+'</div>';
  }
  h+='<div class="brand">'+esc(BRAND)+'</div>';
  document.getElementById('app').innerHTML=h;
  /* fit：每段（| 分隔）都排在一行，字太長就縮小字級直到放得下 */
  if(v.fit)document.querySelectorAll('.s').forEach(function(e){
    e.style.whiteSpace='nowrap';var fs=parseFloat(getComputedStyle(e).fontSize);
    e.style.width='max-content';var W=1080-160;
    while(e.getBoundingClientRect().width>W&&fs>36){fs-=1;e.style.fontSize=fs+'px'}
    e.style.width='';
  });
}
</script></body></html>
