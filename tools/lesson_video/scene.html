<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* 1920×1080 畫面。字級以「手機直向看 16:9 影片」為準：英文句子 92px（約等於手機上 19px） */
:root{--paper:#F7F3E8;--ink:#262626;--wine:#6B2D3C;--ok:#1F653C;--ok-soft:#EDF6EF;--bad:#A32C31;--muted:#5B5B5B;--hi:#FFE27A;--blue:#1F5C99}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif}
.serif{font-family:"Source Serif 4","Noto Serif CJK TC",Georgia,serif}
#stage{position:relative;width:1920px;height:1080px;padding:70px 110px}
.head{display:flex;align-items:center;justify-content:space-between}
.title{font-size:54px;font-weight:900;color:var(--wine)}
.brand{font-size:34px;font-weight:700;color:var(--muted)}
.sent{margin-top:118px;font-size:92px;line-height:1.3;font-weight:500}
.sent .l2{margin-top:46px}
.w{position:relative;display:inline-block;padding:0 .08em;border-radius:14px}
.blank{display:inline-block;min-width:3.4em;border-bottom:7px solid var(--ink);transform:translateY(-6px)}
.blank.fill{border-color:var(--ok);color:var(--ok);font-weight:600;min-width:0;padding:0 .1em}
.opts{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:22px 60px;font-size:58px}
.opt{display:flex;align-items:center;gap:28px;padding:12px 28px;border-radius:22px;border:4px solid #DDD8C8;background:#fff;transition:opacity .2s}
.bub{flex:none;width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font:700 46px "Noto Sans TC","Noto Sans CJK TC",sans-serif}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.dim{opacity:.35}
.opt.trap{opacity:1;border-color:var(--bad)}
.note{font:700 38px "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--bad);margin-left:auto}
.ring{position:absolute;inset:-10px -16px;border:8px solid var(--bad);border-radius:999px;pointer-events:none}
.lab{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 44px "Noto Sans TC","Noto Sans CJK TC",sans-serif;padding:6px 22px;border-radius:999px;color:#fff}
.lab.top{bottom:calc(100% + 18px)}
.lab.red{background:var(--bad)}
.lab.blue{background:var(--blue)}
.mark{background:linear-gradient(transparent 58%,var(--hi) 58%)}
svg#arr{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
.ask{position:absolute;font:900 56px "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--blue);background:#fff;border:5px solid var(--blue);padding:14px 34px;border-radius:28px}
.rule{position:absolute;left:110px;right:110px;bottom:40px;font:900 56px/1.3 "Noto Sans TC","Noto Sans CJK TC",sans-serif;text-align:center;background:var(--wine);color:#fff;padding:22px;border-radius:26px}
.rule.blue{background:var(--blue)}
.rule.red{background:var(--bad)}
.count{position:absolute;right:110px;bottom:40px;width:150px;height:150px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font:900 100px "Noto Sans TC","Noto Sans CJK TC",sans-serif}
.think{position:absolute;right:290px;bottom:85px;font:700 56px "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--wine)}
.zh{margin-top:40px;font:700 60px "Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--muted)}
.big{margin-top:150px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* render(data, scene, n)：依場景畫出畫面。場景是累加的：seemed → customers → rule → answer → trap */
var ORDER=['q','countdown','seemed','customers','rule','answer','trap','full'];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function render(d,scene,n){
  var at=ORDER.indexOf(scene),has=function(s){return at>=ORDER.indexOf(s)};
  var st=document.getElementById('stage');
  var head='<div class="head"><div class="title">'+esc(d.title)+'</div><div class="brand">Score Rescue｜詞性小課 第1課</div></div>';
  if(scene==='full'){
    st.innerHTML=head+'<div class="sent serif big">The <span class="mark">customers</span> seemed <span class="blank fill">satisfied</span> with the new service.</div><div class="zh">'+esc(d.zh_full)+'</div>';
    return;
  }
  var s=d.stem;
  var sent='<div class="sent serif"><div>'+esc(s[0]).replace('customers','<span class="w" id="wCus">customers</span>')+' <span class="w" id="wSeem">'+esc(s[1])+'</span> <span class="w" id="wBlank"><span class="blank"></span></span></div><div class="l2">'+esc(s[3])+'</div></div>';
  var opts='<div class="opts serif">'+d.options.map(function(t,k){
    var c='opt';
    if(has('answer')){c+=k===d.answer?' ok':' dim'}
    if(has('trap')&&k===3)c+=' trap';
    return '<div class="'+c+'"><span class="bub">'+'ABCD'[k]+'</span><span>'+esc(t)+'</span>'+'</div>';
  }).join('')+'</div>';
  st.innerHTML=head+sent+opts+'<svg id="arr"></svg>';
  if(scene==='countdown'){st.insertAdjacentHTML('beforeend','<div class="think">先想一想</div><div class="count">'+n+'</div>')}
  if(has('seemed')){
    var w=document.getElementById('wSeem');w.insertAdjacentHTML('beforeend','<span class="ring"></span><span class="lab top red">連綴動詞</span>');
  }
  if(has('customers')&&!has('answer')){
    var c=document.getElementById('wCus');c.insertAdjacentHTML('beforeend','<span class="lab top blue">主詞</span>');
    var b=document.getElementById('wBlank').getBoundingClientRect(),r=c.getBoundingClientRect();
    var x1=b.left+b.width/2,y1=b.bottom+14,x2=r.left+r.width/2,y2=r.bottom+14,mid=(x1+x2)/2,dip=Math.max(y1,y2)+62;
    document.getElementById('arr').innerHTML='<defs><marker id="h" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C99"/></marker></defs>'+
      '<path d="M'+x1+','+y1+' Q'+mid+','+dip+' '+x2+','+y2+'" fill="none" stroke="#1F5C99" stroke-width="9" stroke-linecap="round" marker-end="url(#h)"/>';
    st.insertAdjacentHTML('beforeend','<div class="rule blue">空格描述主詞 customers：顧客看起來怎麼樣？</div>');
  }
  if(has('rule')&&!has('trap'))st.insertAdjacentHTML('beforeend','<div class="rule">連綴動詞後，描述主詞的狀態 → 形容詞</div>');
  if(has('trap'))st.insertAdjacentHTML('beforeend','<div class="rule red">這格描述顧客的狀態，所以用形容詞 satisfied。</div>');
}
</script>
</body>
</html>
